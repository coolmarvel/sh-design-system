# 쇼케이스 확인용 — http://localhost:8083/ (8080~8082 는 다른 프로젝트가 사용 중)
services:
  showcase:
    image: nginx:1.27.5-alpine
    container_name: sh-design-system-showcase
    ports:
      - "8083:80"
    volumes:
      - ./showcase:/usr/share/nginx/html/showcase:ro
      - ./dist:/usr/share/nginx/html/dist:ro
      - ./references:/usr/share/nginx/html/references:ro
      - ./components:/usr/share/nginx/html/components:ro
      - ./build/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
